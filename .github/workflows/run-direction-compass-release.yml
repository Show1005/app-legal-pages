name: Run Direction Compass App Store link update

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-direction-compass-release.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/direction-compass-app-store
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          reps = [
            (Path('index.html'), '<div class="app-content"><h3>Direction Compass</h3><div class="links"><a class="document-link" href="direction-compass/support.html">サポート</a><a class="document-link" href="direction-compass/privacy-policy.html">プライバシー</a></div></div>', '<div class="app-content"><h3>Direction Compass</h3><div class="links"><a class="document-link" href="direction-compass/support.html">サポート</a><a class="document-link" href="direction-compass/privacy-policy.html">プライバシー</a></div><a class="appstore-link" href="https://apps.apple.com/jp/app/direction-compass/id6793981416" target="_blank" rel="noopener"><img src="Download-on-the-App-Store/JP/Download_on_App_Store/Black_lockup/SVG/Download_on_the_App_Store_Badge_JP_RGB_blk_100317.svg" alt="App Storeからダウンロード" height="40"></a></div>'),
            (Path('en/index.html'), '<div class="app-content"><h3>Direction Compass</h3><div class="links"><a class="document-link" href="direction-compass/support.html">Support</a><a class="document-link" href="direction-compass/privacy-policy.html">Privacy</a></div></div>', '<div class="app-content"><h3>Direction Compass</h3><div class="links"><a class="document-link" href="direction-compass/support.html">Support</a><a class="document-link" href="direction-compass/privacy-policy.html">Privacy</a></div><a class="appstore-link" href="https://apps.apple.com/jp/app/direction-compass/id6793981416" target="_blank" rel="noopener"><img src="../Download-on-the-App-Store/US/Download_on_App_Store/Black_lockup/SVG/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg" alt="Download on the App Store" height="40"></a></div>')
          ]
          for p, old, new in reps:
            s = p.read_text()
            if old not in s: raise SystemExit(f'target block not found: {p}')
            p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/release-direction-compass.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add Direction Compass App Store links'
          git push origin HEAD:release/direction-compass-app-store
