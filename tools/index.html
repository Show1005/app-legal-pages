<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="/app-legal-pages/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Legal Pages | Tools</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef4ff;
        --panel: #ffffff;
        --text: #1f2933;
        --muted: #52606d;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --border: #d9e2ec;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
        background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
        color: var(--text);
        line-height: 1.7;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      .hero,
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 14px 40px rgba(31, 41, 51, 0.08);
      }

      .hero {
        padding: 28px 24px;
        margin-bottom: 20px;
      }

      .card {
        padding: 22px 20px;
      }

      .card + .card { margin-top: 16px; }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 700;
      }

      h1, h2 { line-height: 1.3; }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      h2 {
        margin: 0 0 10px;
        font-size: 1.4rem;
      }

      p { margin: 0; color: var(--muted); }

      ul {
        margin: 16px 0 0;
        padding-left: 20px;
      }

      li + li { margin-top: 10px; }

      a { color: var(--accent); }

      .backlink {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght%40400;500&amp;family=Space+Grotesk:wght%40500;700&amp;family=Zen+Kaku+Gothic+New:wght%40400;500;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/legal-pages.css">
  </head>
  <body>
    <header class="lillip-header">
      <a class="lillip-brand" href="../index.html"><img class="lillip-brand-icon" src="../favicon.png" alt="Lillip Apps" width="30" height="30"><span>Lillip Apps</span></a>
      <nav class="lillip-nav" aria-label="Site navigation"><a href="../index.html">Legal</a><a href="https://show1005.github.io/lillip-apps/"><span class="lillip-apps-label">Apps </span>↗</a><label class="lillip-language-switcher"><span>Language</span><select class="lillip-language-select" aria-label="Language" data-ja-url="index.html" data-en-url="en/index.html"><option value="ja">日本語</option><option value="en">English</option></select></label></nav>
    </header>
    <main>
      <section class="hero">
        <div class="eyebrow">Tools</div>
        <h1>Tools</h1>
        <p>小規模 iOS アプリに関連する補助ツール一覧です。</p>
      </section>

      <section class="card" aria-labelledby="pitch-note-checker-tools">
        <h2 id="pitch-note-checker-tools">音階チェッカー</h2>
        <p>音名確認やテスト用の補助ツールです。</p>
        <ul>
          <li><a href="../pitch-note-checker/hz-piano.html">Hz指定ピアノ</a> - 周波数や鍵盤からテスト音を鳴らせます。</li>
        </ul>
      </section>

      <section class="card" aria-labelledby="nfc-setup-tools">
        <h2 id="nfc-setup-tools">NFCタグセットアップ</h2>
        <p>ショートカット起動タグの作成例です。</p>
        <ul>
          <li><a href="../nfc-setup/shortcuts.html">ショートカットサンプル集</a> - NFCタグから起動できるショートカットの作成例を紹介します。</li>
        </ul>
      </section>

      <p class="backlink"><a href="../index.html">一覧ページへ戻る</a></p>
    </main>
    <script src="../assets/language-switcher.js"></script>
  </body>
</html>
